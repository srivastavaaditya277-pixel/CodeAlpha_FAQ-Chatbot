<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI FAQ Chatbot</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="chatbot">

        <!-- Header -->
        <div class="chat-header">

            <div class="bot-info">
                <div class="bot-icon">🤖</div>

                <div>
                    <h2>AI FAQ Chatbot</h2>
                    <span>● Online</span>
                </div>
            </div>

            <button id="darkModeBtn" class="dark-btn">
                🌙
            </button>

            <button id="clearBtn" class="clear-btn">
                🗑️
            </button>

        </div>


        <!-- Chat Area -->
        <div id="chatMessages" class="chat-messages">

            <div class="message bot-message">

                <div class="avatar">🤖</div>

                <div class="message-content">
                    <p>
                        Hi there! 👋<br>
                        I'm your FAQ assistant. Ask me anything!
                    </p>
                </div>

            </div>
            <div id="typing" class="typing">
                🤖 Bot is typing...
            </div>
        </div>


        <!-- Input Area -->
        <div class="input-area">

            <input type="text" id="userInput" placeholder="Type your question..." autocomplete="off">

            <button id="sendBtn" class="send-btn">
                ➤
            </button>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
